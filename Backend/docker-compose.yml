services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__LibraryDatabase: Host=postgres;Port=5432;Database=library;Username=library;Password=library
      Jwt__PrivateKeyPemPath: /run/secrets/jwt-private.pem
      Jwt__PublicKeyPemPath: /run/secrets/jwt-public.pem
    volumes:
      - ./src/pem/jwt-private.pem:/run/secrets/jwt-private.pem:ro
      - ./src/pem/jwt-public.pem:/run/secrets/jwt-public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"
    volumes:
      - library-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  library-postgres-data:
